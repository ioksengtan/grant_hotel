<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圓山亮燈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#050b26;
  --ink:#f3e8c6;
  --dim:#9aa3d1;
  --gold:#f2c75c;
  --red:#c0312f;
  --line:#26347a;
  --panel:#0b1438;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  background:var(--night);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
}
header{width:100%;max-width:640px;padding:18px 20px 4px}
h1{
  margin:0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  font-weight:900;font-size:30px;letter-spacing:.12em;color:var(--gold);
}
header p{margin:6px 0 0;color:var(--dim);font-size:14px;line-height:1.6}
.stage{width:100%;max-width:640px;padding:6px 0 0}
#hotel{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.controls{width:100%;max-width:640px;padding:6px 16px 28px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tab{
  appearance:none;background:none;border:0;color:var(--dim);
  font:500 16px "Noto Sans TC","PingFang TC",sans-serif;letter-spacing:.2em;
  padding:12px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.panel{padding:16px 2px 0}
.panel[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  appearance:none;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;
  font:500 15px "Noto Sans TC","PingFang TC",sans-serif;padding:9px 16px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--gold);color:#201400;border-color:var(--gold)}
.hint{margin:12px 0 0;color:var(--dim);font-size:13px;line-height:1.6}
.row{display:flex;gap:10px;align-items:center}
input[type=text]{
  flex:1;min-width:0;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  font:500 16px "Noto Sans TC","PingFang TC",sans-serif;
}
.speed{display:flex;align-items:center;gap:12px;margin-top:14px;color:var(--dim);font-size:14px}
.speed input{flex:1;accent-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>圓山亮燈</h1>
  <p>把圓山大飯店的 192 扇窗，當成一塊點矩陣螢幕。</p>
</header>

<div class="stage">
  <svg id="hotel" viewBox="0 0 400 320" role="img" aria-label="圓山大飯店夜景，窗戶可以開關燈">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#050f45"/>
        <stop offset=".65" stop-color="#1636a0"/>
        <stop offset="1" stop-color="#2a55cc"/>
      </linearGradient>
      <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7a5630"/>
        <stop offset="1" stop-color="#3a2514"/>
      </linearGradient>
      <linearGradient id="lobby" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd778"/>
        <stop offset="1" stop-color="#b4651f"/>
      </linearGradient>
      <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#14412a"/>
        <stop offset="1" stop-color="#0a2417"/>
      </linearGradient>
      <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
      <filter id="blurBig" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>

    <rect width="400" height="320" fill="url(#sky)"/>
    <path d="M0,250 Q40,214 90,236 T170,238 L170,300 L0,300Z" fill="#06102f"/>
    <path d="M400,246 Q356,206 310,232 T230,238 L230,300 L400,300Z" fill="#06102f"/>

    <g id="bg">
      <!-- top roof -->
      <polygon points="92,66 114,34 286,34 308,66" fill="url(#roof)"/>
      <g id="tiles" stroke="rgba(255,215,120,.16)" stroke-width="1"></g>
      <path d="M114,34 L286,34" stroke="#e5b84f" stroke-width="2.4"/>
      <polygon points="114,34 106,25 120,31" fill="#e5b84f"/>
      <polygon points="286,34 294,25 280,31" fill="#e5b84f"/>
      <path d="M92,66 L308,66" stroke="#e5b84f" stroke-width="1.6"/>
      <!-- frieze -->
      <polygon points="92,66 308,66 298,86 102,86" fill="#a82529"/>
      <path d="M102,86 L298,86" stroke="#e5b84f" stroke-width="1.2"/>
      <!-- lower roof -->
      <polygon points="18,100 54,87 346,87 382,100 362,112 38,112" fill="url(#roof)"/>
      <path d="M54,87 L346,87" stroke="#e5b84f" stroke-width="1.6"/>
      <path d="M38,112 L362,112" stroke="#d9a548" stroke-width="1.4"/>
      <g id="brackets"></g>
      <!-- body -->
      <rect x="68" y="124" width="264" height="140" fill="#101a58"/>
      <g id="cols"></g>
      <rect x="68" y="124" width="264" height="140" fill="none" stroke="#b02a2a" stroke-width="3.5"/>
    </g>

    <g id="lanternBase"></g>
    <g id="lanternGlow" filter="url(#blur)"></g>
    <g id="lanternLit"></g>
    <g id="winBase"></g>
    <g id="glow" filter="url(#blur)"></g>
    <g id="win"></g>

    <g id="fg">
      <!-- canopy and lobby -->
      <rect x="148" y="250" width="104" height="20" fill="url(#lobby)"/>
      <g stroke="#b02a2a" stroke-width="3">
        <line x1="152" y1="250" x2="152" y2="270"/><line x1="176" y1="250" x2="176" y2="270"/>
        <line x1="200" y1="250" x2="200" y2="270"/><line x1="224" y1="250" x2="224" y2="270"/>
        <line x1="248" y1="250" x2="248" y2="270"/>
      </g>
      <polygon points="130,252 270,252 256,238 144,238" fill="url(#roof)"/>
      <path d="M130,252 L270,252" stroke="#e5b84f" stroke-width="1.6"/>
      <!-- terrace -->
      <rect x="30" y="268" width="340" height="12" fill="#3d4670"/>
      <rect x="30" y="268" width="340" height="2" fill="#6b76a8"/>
      <!-- lawn -->
      <rect x="0" y="280" width="400" height="40" fill="url(#lawn)"/>
      <!-- stairs -->
      <polygon points="156,270 244,270 254,292 146,292" fill="#8a91ad"/>
      <g stroke="#5b6283" stroke-width="1">
        <line x1="154" y1="276" x2="246" y2="276"/><line x1="151" y1="282" x2="249" y2="282"/><line x1="148" y1="287" x2="252" y2="287"/>
      </g>
      <ellipse cx="200" cy="300" rx="40" ry="6" fill="#1b5a35"/>
      <ellipse cx="110" cy="302" rx="46" ry="9" fill="#17492c"/>
      <ellipse cx="292" cy="302" rx="46" ry="9" fill="#17492c"/>
      <!-- lamps -->
      <g>
        <line x1="96" y1="296" x2="96" y2="272" stroke="#10163a" stroke-width="2"/>
        <circle cx="96" cy="270" r="7" fill="#ffc45a" opacity=".85" filter="url(#blurBig)"/>
        <circle cx="96" cy="270" r="2.6" fill="#ffe7a1"/>
        <line x1="304" y1="296" x2="304" y2="272" stroke="#10163a" stroke-width="2"/>
        <circle cx="304" cy="270" r="7" fill="#ffc45a" opacity=".85" filter="url(#blurBig)"/>
        <circle cx="304" cy="270" r="2.6" fill="#ffe7a1"/>
      </g>
    </g>
  </svg>
</div>

<div class="controls">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-draw" aria-selected="true" data-mode="draw">繪製</button>
    <button class="tab" role="tab" id="tab-anim" aria-selected="false" data-mode="anim">動畫</button>
    <button class="tab" role="tab" id="tab-text" aria-selected="false" data-mode="text">文字</button>
  </div>

  <div class="panel" id="panel-draw">
    <div class="chips">
      <button class="chip" data-preset="night">夜景</button>
      <button class="chip" data-preset="all">全亮</button>
      <button class="chip" data-preset="none">全滅</button>
      <button class="chip" data-preset="invert">反轉</button>
    </div>
    <p class="hint">點一下窗戶開關燈，手指拖過去可以連續塗。</p>
  </div>

  <div class="panel" id="panel-anim" hidden>
    <div class="chips" id="anims">
      <button class="chip" data-anim="chase" aria-pressed="true">跑馬</button>
      <button class="chip" data-anim="breathe" aria-pressed="false">呼吸</button>
      <button class="chip" data-anim="floors" aria-pressed="false">逐層亮起</button>
      <button class="chip" data-anim="twinkle" aria-pressed="false">閃爍</button>
      <button class="chip" data-anim="radial" aria-pressed="false">擴散</button>
    </div>
    <p class="hint">屋簷下的紅燈籠會跟著窗戶一起亮。</p>
  </div>

  <div class="panel" id="panel-text" hidden>
    <div class="row"><input id="msg" type="text" value="圓山大飯店 歡迎光臨" maxlength="40" aria-label="要顯示的文字"></div>
    <div class="speed"><span>慢</span><input id="speed" type="range" min="3" max="14" value="6" aria-label="捲動速度"><span>快</span></div>
    <p class="hint">文字會從右邊捲進來，每一格窗戶就是一個像素。</p>
  </div>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var COLS=16, ROWS=12;
  var GX=80, GY=130, CW=15, CH=128/12;
  var NL=32; // lanterns
  function el(tag,attrs,parent){
    var e=document.createElementNS(NS,tag);
    for(var k in attrs) e.setAttribute(k,attrs[k]);
    if(parent) parent.appendChild(e);
    return e;
  }
  var $=function(id){return document.getElementById(id)};
  var svg=$('hotel');

  // decorative bits
  var g=$('tiles');
  for(var x=118;x<=284;x+=6) el('line',{x1:x,y1:35,x2:x+(x-200)*0.1,y2:66},g);
  g=$('brackets');
  el('rect',{x:56,y:112,width:288,height:12,fill:'#16205f'},g);
  for(var x=60;x<=340;x+=5){
    el('line',{x1:x,y1:112,x2:x,y2:124,stroke:(Math.round((x-60)/5)%2?'#3b57c9':'#b02a2a'),'stroke-width':1.6},g);
  }
  g=$('cols');
  for(var k=0;k<=8;k++) el('rect',{x:GX+30*k-1.2,y:124,width:2.4,height:140,fill:'#b02a2a'},g);
  for(var r=0;r<=ROWS;r++) el('line',{x1:68,y1:GY+r*CH,x2:332,y2:GY+r*CH,stroke:'#7f2230','stroke-width':1.1},g);

  // lanterns
  var lantX=[], lBase=$('lanternBase'), lGlow=$('lanternGlow'), lLit=$('lanternLit');
  var lanternLit=[], lanternGlow=[];
  for(var i=0;i<NL;i++){
    var lx=108+i*(184/(NL-1));
    lantX.push(lx);
    el('ellipse',{cx:lx,cy:76,rx:3.1,ry:4.3,fill:'#5a1a1c'},lBase);
    lanternGlow.push(el('ellipse',{cx:lx,cy:76,rx:4.6,ry:5.8,fill:'#ffc95a','fill-opacity':0},lGlow));
    lanternLit.push(el('ellipse',{cx:lx,cy:76,rx:3.1,ry:4.3,fill:'#ffe2a0','fill-opacity':0},lLit));
  }

  // windows
  var wb=$('winBase'), gl=$('glow'), wn=$('win');
  var winEl=[], glowEl=[];
  for(var r=0;r<ROWS;r++){
    winEl.push([]); glowEl.push([]);
    for(var c=0;c<COLS;c++){
      var cx=GX+c*CW+CW/2, cy=GY+r*CH+CH/2;
      el('rect',{x:cx-4.5,y:cy-3.1,width:9,height:6.2,rx:.8,fill:'#0a1240',stroke:'#24357f','stroke-width':.5},wb);
      glowEl[r].push(el('rect',{x:cx-6,y:cy-4.6,width:12,height:9.2,rx:2,fill:'#ffc95a','fill-opacity':0},gl));
      winEl[r].push(el('rect',{x:cx-4.5,y:cy-3.1,width:9,height:6.2,rx:.8,fill:'#ffe9ab','fill-opacity':0},wn));
    }
  }

  // state
  function mk(){var a=[];for(var r=0;r<ROWS;r++)a.push(new Float32Array(COLS));return a}
  var user=mk(), disp=mk(), tgt=mk();
  var mode='draw', anim='chase';
  var tw=[]; // twinkle states

  function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function night(){
    var rnd=seeded(7);
    for(var r=0;r<ROWS;r++){
      var bias=0.45+0.3*rnd();
      for(var c=0;c<COLS;c++) user[r][c]=rnd()<bias?1:0;
    }
  }
  function fillAll(v){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)user[r][c]=v}
  function invert(){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)user[r][c]=user[r][c]>0.5?0:1}
  night();

  function initTwinkle(){
    tw=[];
    for(var r=0;r<ROWS;r++){tw.push([]);for(var c=0;c<COLS;c++)tw[r].push(Math.random()<0.6)}
  }
  initTwinkle();
  var lastTw=0;

  // text bitmap
  var bm=[], bw=0;
  var FONT='700 11px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  function buildText(str){
    var cv=document.createElement('canvas'), ctx=cv.getContext('2d');
    ctx.font=FONT;
    var w=Math.max(1,Math.ceil(ctx.measureText(str).width)+2);
    cv.width=w; cv.height=ROWS;
    ctx.font=FONT; ctx.fillStyle='#fff'; ctx.textBaseline='middle';
    ctx.fillText(str,1,ROWS/2+0.5);
    var d=ctx.getImageData(0,0,w,ROWS).data;
    bm=[]; bw=w;
    for(var x=0;x<w;x++){
      var col=new Uint8Array(ROWS);
      for(var r=0;r<ROWS;r++) col[r]=d[(r*w+x)*4+3]>110?1:0;
      bm.push(col);
    }
  }
  var msg=$('msg'), speed=$('speed');
  buildText(msg.value);
  msg.addEventListener('input',function(){buildText(msg.value||' ')});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){buildText(msg.value||' ')});

  function computeTarget(t,now){
    var r,c;
    if(mode==='draw'){
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)tgt[r][c]=user[r][c];
      return;
    }
    if(mode==='text'){
      var span=bw+COLS+4;
      var off=Math.floor((t*parseFloat(speed.value))%span);
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
        var x=c+off-COLS;
        tgt[r][c]=(x>=0&&x<bw)?bm[x][r]:0;
      }
      return;
    }
    if(anim==='chase'){
      var W=COLS+4, pos=(t*7)%W;
      for(c=0;c<COLS;c++){
        var d=((pos-c)%W+W)%W, v=d<6?1-d/6:0;
        for(r=0;r<ROWS;r++)tgt[r][c]=v;
      }
    }else if(anim==='breathe'){
      for(r=0;r<ROWS;r++){
        var v2=0.12+0.88*(0.5+0.5*Math.sin(t*1.7-r*0.4));
        for(c=0;c<COLS;c++)tgt[r][c]=v2;
      }
    }else if(anim==='floors'){
      var cyc=ROWS+6, p=(t*2.2)%cyc;
      for(r=0;r<ROWS;r++){
        var fb=ROWS-1-r;
        var on=(p<ROWS+3)&&(fb<Math.min(p,ROWS));
        for(c=0;c<COLS;c++)tgt[r][c]=on?1:0;
      }
    }else if(anim==='twinkle'){
      if(now-lastTw>130){
        lastTw=now;
        for(var n=0;n<4;n++){
          var rr=Math.floor(Math.random()*ROWS), cc=Math.floor(Math.random()*COLS);
          tw[rr][cc]=!tw[rr][cc];
        }
      }
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)tgt[r][c]=tw[r][c]?1:0;
    }else if(anim==='radial'){
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
        var dd=Math.hypot((c-7.5)*0.95,(r-5.5)*1.0);
        tgt[r][c]=Math.sin(dd*1.15-t*3.2)>0.25?1:0.1;
      }
    }
  }

  var prev=new Float32Array(ROWS*COLS).fill(-1);
  var t0=performance.now();
  function frame(now){
    var t=(now-t0)/1000;
    computeTarget(t,now);
    var k=mode==='text'?0.55:0.28;
    var colMean=new Float32Array(COLS);
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var d=disp[r][c]+(tgt[r][c]-disp[r][c])*k;
        if(Math.abs(d-tgt[r][c])<0.004)d=tgt[r][c];
        disp[r][c]=d;
        colMean[c]+=d/ROWS;
        var i=r*COLS+c;
        if(Math.abs(d-prev[i])>0.003){
          prev[i]=d;
          winEl[r][c].setAttribute('fill-opacity',d.toFixed(3));
          glowEl[r][c].setAttribute('fill-opacity',(d*0.8).toFixed(3));
        }
      }
    }
    for(var j=0;j<NL;j++){
      var cf=(lantX[j]-68)/264*COLS-0.5;
      var c0=Math.max(0,Math.min(COLS-1,Math.round(cf)));
      var v=0.3+0.7*colMean[c0];
      lanternLit[j].setAttribute('fill-opacity',v.toFixed(3));
      lanternGlow[j].setAttribute('fill-opacity',(v*0.85).toFixed(3));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // draw interaction
  var painting=false, paintVal=1;
  function cellAt(ev){
    var b=svg.getBoundingClientRect();
    var x=(ev.clientX-b.left)/b.width*400, y=(ev.clientY-b.top)/b.height*320;
    var c=Math.floor((x-GX)/CW), r=Math.floor((y-GY)/CH);
    if(c<0||c>=COLS||r<0||r>=ROWS)return null;
    return [r,c];
  }
  svg.addEventListener('pointerdown',function(ev){
    if(mode!=='draw')return;
    var h=cellAt(ev); if(!h)return;
    painting=true;
    paintVal=user[h[0]][h[1]]>0.5?0:1;
    user[h[0]][h[1]]=paintVal;
    try{svg.setPointerCapture(ev.pointerId)}catch(e){}
    ev.preventDefault();
  });
  svg.addEventListener('pointermove',function(ev){
    if(!painting)return;
    var h=cellAt(ev); if(h)user[h[0]][h[1]]=paintVal;
  });
  function stop(){painting=false}
  svg.addEventListener('pointerup',stop);
  svg.addEventListener('pointercancel',stop);
  function setTouch(){svg.style.touchAction=mode==='draw'?'none':'auto';svg.style.cursor=mode==='draw'?'pointer':'default'}
  setTouch();

  // UI
  var tabs=document.querySelectorAll('.tab');
  var panels={draw:$('panel-draw'),anim:$('panel-anim'),text:$('panel-text')};
  function setMode(m){
    mode=m; painting=false;
    tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.mode===m?'true':'false')});
    for(var k in panels)panels[k].hidden=(k!==m);
    if(m==='anim'&&anim==='twinkle')initTwinkle();
    t0=performance.now();
    setTouch();
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){setMode(t.dataset.mode)})});

  document.querySelectorAll('[data-preset]').forEach(function(b){
    b.addEventListener('click',function(){
      var p=b.dataset.preset;
      if(p==='night')night();
      else if(p==='all')fillAll(1);
      else if(p==='none')fillAll(0);
      else invert();
    });
  });
  document.querySelectorAll('[data-anim]').forEach(function(b){
    b.addEventListener('click',function(){
      anim=b.dataset.anim;
      document.querySelectorAll('[data-anim]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
      if(anim==='twinkle')initTwinkle();
      t0=performance.now();
    });
  });
})();
</script>
</body>
</html>
