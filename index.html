<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圓山亮燈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#050b26;
  --ink:#f3e8c6;
  --dim:#9aa3d1;
  --gold:#f2c75c;
  --red:#c0312f;
  --line:#26347a;
  --panel:#0b1438;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  background:var(--night);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
}
header{width:100%;max-width:640px;padding:18px 20px 4px}
h1{
  margin:0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  font-weight:900;font-size:30px;letter-spacing:.12em;color:var(--gold);
}
header p{margin:6px 0 0;color:var(--dim);font-size:14px;line-height:1.6}
.stage{width:100%;max-width:640px;padding:6px 0 0}
#hotel{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.controls{width:100%;max-width:640px;padding:6px 16px 28px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tab{
  appearance:none;background:none;border:0;color:var(--dim);
  font:500 16px "Noto Sans TC","PingFang TC",sans-serif;letter-spacing:.2em;
  padding:12px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.panel{padding:16px 2px 0}
.panel[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  appearance:none;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;
  font:500 15px "Noto Sans TC","PingFang TC",sans-serif;padding:9px 16px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--gold);color:#201400;border-color:var(--gold)}
.hint{margin:12px 0 0;color:var(--dim);font-size:13px;line-height:1.6}
.row{display:flex;gap:10px;align-items:center}
input[type=text]{
  flex:1;min-width:0;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  font:500 16px "Noto Sans TC","PingFang TC",sans-serif;
}
.speed{display:flex;align-items:center;gap:12px;margin-top:14px;color:var(--dim);font-size:14px}
.speed input{flex:1;accent-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>圓山亮燈</h1>
  <p>在水彩夜景裡，用 192 扇窗畫出你的光。點燈、播放動畫，或讓文字走過建築。</p>
</header>

<div class="stage">
  <svg id="hotel" viewBox="0 0 1448 1086" role="img" aria-label="圓山大飯店水彩夜景，窗戶可以開關燈">
    <defs>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <image href="hotel-landscape.png" width="1448" height="1086"/>
    <g id="dark"></g>
    <g id="lit"></g>
    <g id="glow" filter="url(#blur)" style="mix-blend-mode:screen"></g>
  </svg>
</div>

<div class="controls">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-draw" aria-selected="true" data-mode="draw">繪製</button>
    <button class="tab" role="tab" id="tab-anim" aria-selected="false" data-mode="anim">動畫</button>
    <button class="tab" role="tab" id="tab-text" aria-selected="false" data-mode="text">文字</button>
  </div>

  <div class="panel" id="panel-draw">
    <div class="chips">
      <button class="chip" data-preset="night">夜景</button>
      <button class="chip" data-preset="all">全亮</button>
      <button class="chip" data-preset="none">全滅</button>
      <button class="chip" data-preset="invert">反轉</button>
    </div>
    <p class="hint">點一下窗戶開關燈，手指拖過去可以連續塗。</p>
  </div>

  <div class="panel" id="panel-anim" hidden>
    <div class="chips" id="anims">
      <button class="chip" data-anim="chase" aria-pressed="true">跑馬</button>
      <button class="chip" data-anim="breathe" aria-pressed="false">呼吸</button>
      <button class="chip" data-anim="floors" aria-pressed="false">逐層亮起</button>
      <button class="chip" data-anim="twinkle" aria-pressed="false">閃爍</button>
      <button class="chip" data-anim="radial" aria-pressed="false">擴散</button>
    </div>
    <p class="hint">動畫會讓整面窗戶一起亮滅。</p>
  </div>

  <div class="panel" id="panel-text" hidden>
    <div class="row"><input id="msg" type="text" value="GRAND HOTEL" maxlength="40" aria-label="要顯示的文字"></div>
    <div class="speed"><span>慢</span><input id="speed" type="range" min="3" max="14" value="6" aria-label="捲動速度"><span>快</span></div>
    <p class="hint">文字會從右邊捲進來，每一扇窗就是一個像素。窗格為 24×8，英文和數字最清楚。</p>
  </div>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var COLS=24, ROWS=8;
  var GX=177, GY=368, CW=46, CH=39.5, WX=1, WW=35, WH=25, YMAX=670;
  function el(tag,attrs,parent){
    var e=document.createElementNS(NS,tag);
    for(var k in attrs) e.setAttribute(k,attrs[k]);
    if(parent) parent.appendChild(e);
    return e;
  }
  var $=function(id){return document.getElementById(id)};
  var svg=$('hotel');

  // Reuse painted rooms so both light states retain ink lines and paper texture.
  function paintedRoom(parent,sourceX,sourceY,x,y,h){
    var room=el('svg',{x:x,y:y,width:WW,height:h,
      viewBox:sourceX+' '+sourceY+' 48 34',preserveAspectRatio:'none',
      'pointer-events':'none'},parent);
    el('image',{href:'hotel.webp',width:1448,height:1086},room);
    return room;
  }

  var dk=$('dark'), lt=$('lit'), gl=$('glow');
  var litEl=[], glowEl=[];
  for(var r=0;r<ROWS;r++){
    litEl.push([]); glowEl.push([]);
    var y=GY+r*CH, h=Math.min(WH,YMAX-y);
    for(var c=0;c<COLS;c++){
      var x=GX+c*CW+WX;
      var variant=(r*7+c*3)%97;
      paintedRoom(dk,283+(variant%3)*58.1,423,x,y,h);
      var ls=paintedRoom(lt,283+(variant%6)*58.1,380,x,y,h);
      ls.setAttribute('opacity',0);
      litEl[r].push(ls);
      glowEl[r].push(el('rect',{x:x-4,y:y,width:WW+8,height:h,rx:12,fill:'#ffb84a','fill-opacity':0},gl));
    }
  }

  // state
  function mk(){var a=[];for(var r=0;r<ROWS;r++)a.push(new Float32Array(COLS));return a}
  var user=mk(), disp=mk(), tgt=mk();
  var mode='draw', anim='chase';
  var tw=[];

  function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function night(){
    var rnd=seeded(7);
    for(var r=0;r<ROWS;r++){
      var bias=0.45+0.3*rnd();
      for(var c=0;c<COLS;c++) user[r][c]=rnd()<bias?1:0;
    }
  }
  function fillAll(v){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)user[r][c]=v}
  function invert(){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)user[r][c]=user[r][c]>0.5?0:1}
  night();

  function initTwinkle(){
    tw=[];
    for(var r=0;r<ROWS;r++){tw.push([]);for(var c=0;c<COLS;c++)tw[r].push(Math.random()<0.6)}
  }
  initTwinkle();
  var lastTw=0;

  // text bitmap: 5x7 font for letters/digits, canvas fallback for everything else
  var F={
    'A':'01110 10001 10001 11111 10001 10001 10001','B':'11110 10001 10001 11110 10001 10001 11110',
    'C':'01110 10001 10000 10000 10000 10001 01110','D':'11110 10001 10001 10001 10001 10001 11110',
    'E':'11111 10000 10000 11110 10000 10000 11111','F':'11111 10000 10000 11110 10000 10000 10000',
    'G':'01110 10001 10000 10111 10001 10001 01111','H':'10001 10001 10001 11111 10001 10001 10001',
    'I':'01110 00100 00100 00100 00100 00100 01110','J':'00111 00010 00010 00010 00010 10010 01100',
    'K':'10001 10010 10100 11000 10100 10010 10001','L':'10000 10000 10000 10000 10000 10000 11111',
    'M':'10001 11011 10101 10101 10001 10001 10001','N':'10001 11001 10101 10011 10001 10001 10001',
    'O':'01110 10001 10001 10001 10001 10001 01110','P':'11110 10001 10001 11110 10000 10000 10000',
    'Q':'01110 10001 10001 10001 10101 10010 01101','R':'11110 10001 10001 11110 10100 10010 10001',
    'S':'01111 10000 10000 01110 00001 00001 11110','T':'11111 00100 00100 00100 00100 00100 00100',
    'U':'10001 10001 10001 10001 10001 10001 01110','V':'10001 10001 10001 10001 10001 01010 00100',
    'W':'10001 10001 10001 10101 10101 11011 10001','X':'10001 10001 01010 00100 01010 10001 10001',
    'Y':'10001 10001 01010 00100 00100 00100 00100','Z':'11111 00001 00010 00100 01000 10000 11111',
    '0':'01110 10001 10011 10101 11001 10001 01110','1':'00100 01100 00100 00100 00100 00100 01110',
    '2':'01110 10001 00001 00010 00100 01000 11111','3':'11110 00001 00001 01110 00001 00001 11110',
    '4':'00010 00110 01010 10010 11111 00010 00010','5':'11111 10000 11110 00001 00001 10001 01110',
    '6':'00110 01000 10000 11110 10001 10001 01110','7':'11111 00001 00010 00100 01000 01000 01000',
    '8':'01110 10001 10001 01110 10001 10001 01110','9':'01110 10001 10001 01111 00001 00010 01100',
    '!':'00100 00100 00100 00100 00100 00000 00100','.':'00000 00000 00000 00000 00000 00000 00100',
    '-':'00000 00000 00000 11111 00000 00000 00000'
  };
  var bm=[], bw=0;
  var FONT='700 8px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  function glyph(ch){
    var u=ch.toUpperCase();
    if(F[u]){var rows=F[u].split(' ');var cols=[];for(var x=0;x<5;x++){var col=new Uint8Array(ROWS);for(var r=0;r<rows.length;r++)col[r]=rows[r][x]==='1'?1:0;cols.push(col)}return cols}
    if(ch===' ')return [new Uint8Array(ROWS),new Uint8Array(ROWS),new Uint8Array(ROWS)];
    var cv=document.createElement('canvas'),ctx=cv.getContext('2d');
    ctx.font=FONT;var w=Math.max(1,Math.ceil(ctx.measureText(ch).width));
    cv.width=w;cv.height=ROWS;ctx.font=FONT;ctx.fillStyle='#fff';ctx.textBaseline='middle';
    ctx.fillText(ch,0,ROWS/2+0.5);
    var d=ctx.getImageData(0,0,w,ROWS).data,out=[];
    for(var x2=0;x2<w;x2++){var c2=new Uint8Array(ROWS);for(var r2=0;r2<ROWS;r2++)c2[r2]=d[(r2*w+x2)*4+3]>110?1:0;out.push(c2)}
    return out;
  }
  function buildText(str){
    bm=[];
    Array.from(str).forEach(function(ch){
      glyph(ch).forEach(function(col){bm.push(col)});
      bm.push(new Uint8Array(ROWS));
    });
    if(!bm.length)bm.push(new Uint8Array(ROWS));
    bw=bm.length;
  }
  var msg=$('msg'), speed=$('speed');
  buildText(msg.value);
  msg.addEventListener('input',function(){buildText(msg.value||' ')});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){buildText(msg.value||' ')});

  function computeTarget(t,now){
    var r,c;
    if(mode==='draw'){
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)tgt[r][c]=user[r][c];
      return;
    }
    if(mode==='text'){
      var span=bw+COLS+4;
      var off=Math.floor((t*parseFloat(speed.value)*0.6)%span);
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
        var x=c+off-COLS;
        tgt[r][c]=(x>=0&&x<bw)?bm[x][r]:0;
      }
      return;
    }
    if(anim==='chase'){
      var W=COLS+4, pos=(t*7)%W;
      for(c=0;c<COLS;c++){
        var d=((pos-c)%W+W)%W, v=d<6?1-d/6:0;
        for(r=0;r<ROWS;r++)tgt[r][c]=v;
      }
    }else if(anim==='breathe'){
      for(r=0;r<ROWS;r++){
        var v2=0.12+0.88*(0.5+0.5*Math.sin(t*1.7-r*0.6));
        for(c=0;c<COLS;c++)tgt[r][c]=v2;
      }
    }else if(anim==='floors'){
      var cyc=ROWS+4, p=(t*1.6)%cyc;
      for(r=0;r<ROWS;r++){
        var fb=ROWS-1-r;
        var on=(p<ROWS+2)&&(fb<Math.min(p,ROWS));
        for(c=0;c<COLS;c++)tgt[r][c]=on?1:0;
      }
    }else if(anim==='twinkle'){
      if(now-lastTw>130){
        lastTw=now;
        for(var n=0;n<3;n++){
          var rr=Math.floor(Math.random()*ROWS), cc=Math.floor(Math.random()*COLS);
          tw[rr][cc]=!tw[rr][cc];
        }
      }
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)tgt[r][c]=tw[r][c]?1:0;
    }else if(anim==='radial'){
      for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
        var dd=Math.hypot((c-(COLS-1)/2)*0.7,(r-(ROWS-1)/2)*1.0);
        tgt[r][c]=Math.sin(dd*1.3-t*3.2)>0.25?1:0.1;
      }
    }
  }

  var prev=new Float32Array(ROWS*COLS).fill(-1);
  var t0=performance.now();
  function frame(now){
    var t=(now-t0)/1000;
    computeTarget(t,now);
    var k=mode==='text'?0.55:0.28;
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var d=disp[r][c]+(tgt[r][c]-disp[r][c])*k;
        if(Math.abs(d-tgt[r][c])<0.004)d=tgt[r][c];
        disp[r][c]=d;
        var i=r*COLS+c;
        if(Math.abs(d-prev[i])>0.003){
          prev[i]=d;
          litEl[r][c].setAttribute('opacity',d.toFixed(3));
          glowEl[r][c].setAttribute('fill-opacity',(d*0.35).toFixed(3));
        }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // draw interaction
  var painting=false, paintVal=1;
  function cellAt(ev){
    var b=svg.getBoundingClientRect();
    var x=(ev.clientX-b.left)/b.width*1448, y=(ev.clientY-b.top)/b.height*1086;
    var c=Math.floor((x-GX)/CW), r=Math.floor((y-GY)/CH);
    if(c<0||c>=COLS||r<0||r>=ROWS||y>YMAX)return null;
    return [r,c];
  }
  svg.addEventListener('pointerdown',function(ev){
    if(mode!=='draw')return;
    var h=cellAt(ev); if(!h)return;
    painting=true;
    paintVal=user[h[0]][h[1]]>0.5?0:1;
    user[h[0]][h[1]]=paintVal;
    try{svg.setPointerCapture(ev.pointerId)}catch(e){}
    ev.preventDefault();
  });
  svg.addEventListener('pointermove',function(ev){
    if(!painting)return;
    var h=cellAt(ev); if(h)user[h[0]][h[1]]=paintVal;
  });
  function stop(){painting=false}
  svg.addEventListener('pointerup',stop);
  svg.addEventListener('pointercancel',stop);
  function setTouch(){svg.style.touchAction=mode==='draw'?'none':'auto';svg.style.cursor=mode==='draw'?'pointer':'default'}
  setTouch();

  // UI
  var tabs=document.querySelectorAll('.tab');
  var panels={draw:$('panel-draw'),anim:$('panel-anim'),text:$('panel-text')};
  function setMode(m){
    mode=m; painting=false;
    tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.mode===m?'true':'false')});
    for(var k in panels)panels[k].hidden=(k!==m);
    if(m==='anim'&&anim==='twinkle')initTwinkle();
    t0=performance.now();
    setTouch();
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){setMode(t.dataset.mode)})});

  document.querySelectorAll('[data-preset]').forEach(function(b){
    b.addEventListener('click',function(){
      var p=b.dataset.preset;
      if(p==='night')night();
      else if(p==='all')fillAll(1);
      else if(p==='none')fillAll(0);
      else invert();
    });
  });
  document.querySelectorAll('[data-anim]').forEach(function(b){
    b.addEventListener('click',function(){
      anim=b.dataset.anim;
      document.querySelectorAll('[data-anim]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
      if(anim==='twinkle')initTwinkle();
      t0=performance.now();
    });
  });
})();
</script>
</body>
</html>
